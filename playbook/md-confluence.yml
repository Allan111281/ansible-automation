---
- name: Git → Confluence Single Page Sync (Jenkins Hardened)
  hosts: localhost
  gather_facts: no

  vars:
    confluence_base_url: "https://confluence.umit.dk"
    confluence_space_key: "SASDOK"
    parent_page_id: "231933858"
    repo_dest: "/tmp/repo"

  vars_prompt:
    - name: git_repo
      prompt: "Git repo (SSH or HTTPS)"
      private: no

    - name: confluence_user
      prompt: "Confluence user email"
      private: no

    - name: confluence_password
      prompt: "Confluence API token/password"
      private: yes

    - name: confluence_page_title
      prompt: "Confluence page title"
      private: no

  tasks:

    # ----------------------------
    # VALIDATION (ROBUST)
    # ----------------------------
    - name: Validate git repo input
      fail:
        msg: "git_repo is empty or invalid"
      when: git_repo is not defined or git_repo | trim == ''

    # ----------------------------
    # NORMALIZE GIT URL (SSH + HTTPS)
    # ----------------------------
    - name: Normalize Git URL (HTTPS → SSH)
      set_fact:
        git_repo_clean: >-
          {{
            git_repo
            | trim
            | regex_replace('^https://github\\.com/', 'git@github.com:')
            | regex_replace('^https://bitbucket\\.umit\\.dk/scm/', 'git@bitbucket.umit.dk:')
          }}

    - name: Show final Git repo URL
      debug:
        msg: "{{ git_repo_clean }}"

    # ----------------------------
    # CLEAN WORKSPACE
    # ----------------------------
    - name: Clean workspace
      file:
        path: "{{ repo_dest }}"
        state: absent

    # ----------------------------
    # CLONE REPO
    # ----------------------------
    - name: Clone repository
      git:
        repo: "{{ git_repo_clean }}"
        dest: "{{ repo_dest }}"
        force: yes
        accept_hostkey: yes

    # ----------------------------
    # FIND MARKDOWN
    # ----------------------------
    - name: Find markdown file
      find:
        paths: "{{ repo_dest }}"
        patterns: "*.md"
      register: md_files

    - name: Fail if no markdown file found
      fail:
        msg: "No markdown file found in repo"
      when: md_files.files | length == 0

    - name: Set markdown file
      set_fact:
        md_file: "{{ md_files.files[0].path }}"

    # ----------------------------
    # CONVERT MARKDOWN → HTML
    # ----------------------------
    - name: Convert markdown to HTML
      shell: pandoc "{{ md_file }}" -f markdown -t html
      register: html_content
      changed_when: false

    # ----------------------------
    # CHECK PAGE
    # ----------------------------
    - name: Check if page exists
      uri:
        url: "{{ confluence_base_url }}/rest/api/content?title={{ confluence_page_title | urlencode }}&spaceKey={{ confluence_space_key }}&expand=version"
        method: GET
        user: "{{ confluence_user }}"
        password: "{{ confluence_password }}"
        force_basic_auth: yes
        return_content: yes
      register: page_lookup

    - name: Set page state safely
      set_fact:
        page_exists: "{{ page_lookup.json.results is defined and (page_lookup.json.results | length > 0) }}"

    # ----------------------------
    # BUILD CONTENT
    # ----------------------------
    - name: Build Confluence content
      set_fact:
        final_content: |
          <ac:structured-macro ac:name="warning">
            <ac:rich-text-body>
              <p><b>AUTO-GENERATED PAGE</b></p>
              <p>Do NOT edit manually.</p>
            </ac:rich-text-body>
          </ac:structured-macro>
          <hr/>
          {{ html_content.stdout }}

    # ----------------------------
    # CREATE / UPDATE PAGE
    # ----------------------------
    - name: Sync page to Confluence
      uri:
        url: >-
          {{
            confluence_base_url +
            (
              '/rest/api/content/' + page_lookup.json.results[0].id
              if page_exists else '/rest/api/content'
            )
          }}
        method: "{{ 'PUT' if page_exists else 'POST' }}"
        user: "{{ confluence_user }}"
        password: "{{ confluence_password }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          id: "{{ page_lookup.json.results[0].id if page_exists else omit }}"
          type: page
          title: "{{ confluence_page_title }}"
          space:
            key: "{{ confluence_space_key }}"
          ancestors:
            - id: "{{ parent_page_id }}"
          version: >-
            {{
              {'number': page_lookup.json.results[0].version.number | int + 1}
              if page_exists else omit
            }}
          body:
            storage:
              representation: storage
              value: "{{ final_content }}"

    # ----------------------------
    # CLEANUP
    # ----------------------------
    - name: Cleanup workspace
      file:
        path: "{{ repo_dest }}"
        state: absent

    - name: Success message
      debug:
        msg: "Confluence page '{{ confluence_page_title }}' synced successfully"
