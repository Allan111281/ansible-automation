---
- name: VMware Dynamic Folder Tree → Confluence
  hosts: localhost
  gather_facts: no

  vars:
    confluence_base_url: "{{ lookup('env', 'CONFLUENCE_BASE_URL') }}"
    confluence_space_key: "{{ lookup('env', 'CONFLUENCE_SPACE_KEY') }}"
    parent_page_id: "{{ lookup('env', 'PARENT_PAGE_ID') }}"
    confluence_user: "{{ lookup('env', 'CONFLUENCE_USER') }}"
    confluence_password: "{{ lookup('env', 'CONFLUENCE_PASSWORD') }}"
    confluence_page_title: "{{ lookup('env', 'CONFLUENCE_PAGE_TITLE') }}"

    vcenter_hostname: "{{ lookup('env', 'VCENTER_HOST') }}"
    vcenter_user: "{{ lookup('env', 'VCENTER_USER') }}"
    vcenter_password: "{{ lookup('env', 'VCENTER_PASSWORD') }}"

    vm_environment: "{{ lookup('env', 'ENVIRONMENT') | default('UNKNOWN') }}"

  tasks:

  # -----------------------------
  # GET VMS
  # -----------------------------
  - name: Get VM inventory
    community.vmware.vmware_vm_info:
      hostname: "{{ vcenter_hostname }}"
      username: "{{ vcenter_user }}"
      password: "{{ vcenter_password }}"
      validate_certs: false
    register: vm_info

  # -----------------------------
  # FILTER ENVIRONMENT
  # -----------------------------
  - name: Filter by environment root folder
    set_fact:
      env_vms: >-
        {{
          vm_info.virtual_machines
          | selectattr('folder', 'search', vm_environment)
          | list
        }}

  # -----------------------------
  # GROUP FOLDERS
  # -----------------------------
  - name: Build folder list
    set_fact:
      folder_groups: "{{ env_vms | groupby('folder') }}"

  # -----------------------------
  # BUILD HTML
  # -----------------------------
  - name: Build Confluence content dynamically
    set_fact:
      final_content: |
        <h1>VMware Inventory - {{ vm_environment }}</h1>

        {% for group in folder_groups %}

        <hr/>
        <h2>{{ group.0 }}</h2>

        <table border="1">
          <tr>
            <th>VM</th>
            <th>Power</th>
            <th>CPU</th>
            <th>RAM (MB)</th>
          </tr>

          {% for vm in group.1 %}
          <tr>
            <td>{{ vm.guest_name | default(vm.name) }}</td>
            <td>{{ vm.power_state | default('unknown') }}</td>
            <td>{{ vm.num_cpus | default('0') }}</td>
            <td>{{ vm.memory_mb | default('0') }}</td>
          </tr>
          {% endfor %}

        </table>

        {% endfor %}

  # -----------------------------
  # CHECK PAGE
  # -----------------------------
  - name: Check page
    uri:
      url: "{{ confluence_base_url }}/rest/api/content?title={{ confluence_page_title | urlencode }}&spaceKey={{ confluence_space_key }}&expand=version"
      method: GET
      user: "{{ confluence_user }}"
      password: "{{ confluence_password }}"
      force_basic_auth: yes
      return_content: yes
    register: page_lookup

  - set_fact:
      page_exists: "{{ page_lookup.json.results | length > 0 }}"

  # -----------------------------
  # PUSH TO CONFLUENCE
  # -----------------------------
  - name: Push to Confluence
    uri:
      url: >-
        {{
          confluence_base_url +
          (
            '/rest/api/content/' + page_lookup.json.results[0].id
            if page_exists else '/rest/api/content'
          )
        }}
      method: "{{ 'PUT' if page_exists else 'POST' }}"
      user: "{{ confluence_user }}"
      password: "{{ confluence_password }}"
      force_basic_auth: yes
      headers:
        Content-Type: "application/json"
      body_format: json
      body:
        id: "{{ page_lookup.json.results[0].id if page_exists else omit }}"
        type: page
        title: "{{ confluence_page_title }}"
        space:
          key: "{{ confluence_space_key }}"
        ancestors:
          - id: "{{ parent_page_id }}"
        version: >-
          {{
            {'number': page_lookup.json.results[0].version.number | int + 1}
            if page_exists else omit
          }}
        body:
          storage:
            representation: storage
            value: "{{ final_content }}"